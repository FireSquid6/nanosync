name: Release CLI binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun build/release-policy.ts tag "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bash build/test-install.sh

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bash build/binary.sh '${{ matrix.target }}' 'dist/nanosync-${{ matrix.target }}'
      - name: Installer fixtures on macOS Bash 3.2
        if: matrix.target == 'darwin-arm64'
        run: /bin/bash build/test-install.sh
      - name: Native Linux standalone checks
        if: startsWith(matrix.target, 'linux-')
        run: |
          ./dist/nanosync-${{ matrix.target }} --help
          bash build/test-standalone.sh dist/nanosync-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nanosync-${{ matrix.target }}
          path: dist/nanosync-${{ matrix.target }}
          if-no-files-found: error

  android:
    needs: checks
    uses: ./.github/workflows/android.yml

  publish:
    needs: [checks, build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # The latest decision and draft publication must be one serialized operation across tags.
    concurrency:
      group: nanosync-release-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v4
        with:
          pattern: nanosync-linux-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: nanosync-darwin-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: nanosync-android-debug
          path: release-assets
      - run: bun build/release-policy.ts checksums release-assets
      - run: bun build/release-policy.ts verify release-assets
      - name: Stage, verify, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun build/release-policy.ts publish "$GITHUB_REF_NAME"
