plugins {
    id 'com.android.application'
}

android {
    namespace 'org.nanosync.mobile'
    compileSdk 37

    defaultConfig {
        applicationId 'org.nanosync.mobile'
        minSdk 31
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Release keys/passwords are supplied by the owner, never committed or
    // substituted with the disposable debug key. Missing values fail release signing.
    signingConfigs {
        release {
            def keystore = System.getenv('NANOSYNC_ANDROID_KEYSTORE')
            if (keystore) storeFile file(keystore)
            storePassword System.getenv('NANOSYNC_ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('NANOSYNC_ANDROID_KEY_ALIAS')
            keyPassword System.getenv('NANOSYNC_ANDROID_KEY_PASSWORD')
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// The application executes only its bundled, local synchronization code.
// Bun is a build dependency, never an Android runtime dependency.
tasks.register('bundleEngine', Exec) {
    workingDir rootProject.projectDir.parentFile.parentFile
    commandLine 'bun', 'run', 'build/android-engine.ts'
}
tasks.named('preBuild').configure { dependsOn 'bundleEngine' }
