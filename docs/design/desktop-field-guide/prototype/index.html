<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nanosync — desktop design</title><style>
:root{color-scheme:light;--bg:#fbf1c7;--fg:#3c3836;--muted:#665c54;--line:#bdae93;--panel:#f2e5bc;--link:#9d0006;--head:#282828;--focus:#af3a03;--green:#427b58;--yellow:#8f3f00}html[data-theme=dark]{color-scheme:dark;--bg:#282828;--fg:#ebdbb2;--muted:#bdae93;--line:#665c54;--panel:#32302f;--link:#ff7365;--head:#fbf1c7;--focus:#fe8019;--green:#b8bb26;--yellow:#fabd2f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.65 'DejaVu Sans Mono','Liberation Mono',Consolas,monospace}button,input,select,textarea{font:inherit}button,a{color:var(--link);text-underline-offset:4px}a:hover,button.link:hover{color:var(--head)}button{cursor:pointer}button{border:1px solid var(--line);padding:7px 12px;background:transparent;border-radius:0}button:hover{border-color:var(--fg);background:var(--panel)}button.primary{background:var(--head);color:var(--bg);border-color:var(--head)}button.primary:hover{opacity:.86}button.link{padding:0;border:0;background:none;text-decoration:underline}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{color:var(--fg);border:1px solid var(--line);background:var(--bg);padding:8px;accent-color:var(--link);caret-color:var(--link)}input[type=checkbox]{width:16px;height:16px;flex-shrink:0}input:not([type=checkbox]),select,textarea{max-width:100%}label{display:block}label.field{margin:20px 0 8px}label.field input,label.field select{display:block;width:100%;margin-top:7px}.check{display:flex;gap:10px;align-items:flex-start;margin:13px 0}.check input{margin-top:4px}.check small{display:block;color:var(--muted);margin-top:4px}textarea{width:100%;min-height:210px;resize:vertical;line-height:1.8}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:4px}::selection{background:var(--line);color:var(--head)}html{scrollbar-color:var(--muted) var(--bg)}h1,h2,h3{color:var(--head);line-height:1.4}h1{font-size:25px;margin:0 0 7px}h2{font-size:16px;margin:0 0 12px}h3{font-size:13px;margin:24px 0 8px}p{margin:0 0 15px}small,.small{font-size:12px}.muted{color:var(--muted)}.good{color:var(--green)}.danger{color:var(--link)}.warning{color:var(--yellow)}.titlebar{height:44px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:8px 22px;font-size:12px;background:var(--panel)}.titlebar strong{letter-spacing:1px;color:var(--head)}.titlebar button{padding:1px 7px;font-size:12px}.shell{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:calc(100vh - 80px)}aside{border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column;gap:28px}aside nav{display:grid;gap:13px}aside nav button{display:flex;justify-content:space-between;gap:12px;text-align:left;border:0;padding:3px 0;color:var(--muted)}aside nav button[aria-current=page]{font-weight:bold;color:var(--head);text-decoration:underline;text-underline-offset:5px}aside .brand{font-size:17px;font-weight:bold;color:var(--head);letter-spacing:1px}.aside-bottom{margin-top:auto;font-size:12px}.aside-bottom p{margin-bottom:8px}.count{color:var(--link)}main{padding:33px 34px 40px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:27px}.pagehead p{color:var(--muted);margin:5px 0 0}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:14px}.pagehead .actions{padding-top:3px}.notice{padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.notice p{margin:0}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:28px}.folderlist{min-width:0}.listhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--line)}.folder{padding:18px 12px 18px 0;border-bottom:1px solid var(--line)}.folder.selected{background:var(--panel);padding-left:13px}.foldertop{display:flex;justify-content:space-between;align-items:baseline;gap:16px}.folder .name{font-size:14px;font-weight:bold;color:var(--head);text-align:left;border:0;padding:0;background:none}.folder .name:hover{text-decoration:underline}.path{color:var(--muted);font-size:12px;overflow-wrap:anywhere;margin:5px 0 9px}.folder .meta{display:flex;justify-content:space-between;gap:18px;font-size:12px}.status{white-space:nowrap;font-size:12px;display:inline-flex;align-items:center;gap:7px}.symbol{width:9px;height:9px;border:1px solid currentColor;display:inline-block;flex-shrink:0}.symbol.ok{border-radius:50%;background:currentColor}.symbol.attn{transform:rotate(45deg)}.symbol.pause{border-width:0 3px}.symbol.work{border-radius:50%}.progress{height:3px;background:var(--line);margin:11px 0 8px;max-width:100%}.progress span{display:block;height:100%;width:62%;background:var(--fg)}.inspector{border-left:1px solid var(--line);padding-left:25px;min-width:0}.inspector .path{font-size:12px}.inspector p{font-size:12px}.kv{margin:19px 0;font-size:12px}.kv div{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}.rule{border-top:1px solid var(--line);padding-top:20px;margin-top:23px}.inspector .actions{gap:16px}.note{color:var(--muted);font-size:12px;margin-top:17px}.textcol{max-width:760px}.section{padding:22px 0;border-top:1px solid var(--line)}.section:first-child{padding-top:0;border-top:0}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:40px}.settingrow{display:flex;justify-content:space-between;gap:30px;padding:17px 0;border-bottom:1px solid var(--line)}.settingrow p{max-width:65ch;font-size:12px;color:var(--muted);margin:4px 0 0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px 12px 14px 0;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:12px;color:var(--muted);font-weight:normal}.table td{font-size:12px}.table td .muted{font-size:12px}.steps{display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:17px;margin-bottom:30px;font-size:12px;color:var(--muted)}.steps span.active{color:var(--head);font-weight:bold;text-decoration:underline;text-underline-offset:6px}.wizard{max-width:620px}.wizard p{max-width:67ch}.wizard .bottom{border-top:1px solid var(--line);padding-top:20px;margin-top:29px;display:flex;justify-content:space-between;gap:18px}.verification{font-size:31px;letter-spacing:5px;margin:25px 0;color:var(--head)}.quietbox{background:var(--panel);padding:18px;margin:20px 0}.quietbox p:last-child{margin-bottom:0}.error{color:var(--link);font-size:12px;margin-top:10px}dialog{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:29px;width:min(560px,90vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#1d202170}dialog h2{font-size:19px}dialog .actions{margin-top:25px}footer{border-top:1px solid var(--line);padding:8px 20px;display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted);height:36px}footer select{font-size:11px;padding:0 5px;border:0;background:transparent}.toast{position:fixed;bottom:52px;right:24px;padding:13px 18px;background:var(--panel);border:1px solid var(--line);max-width:420px;font-size:12px}.empty{padding:80px 0;max-width:64ch}.inlinecode{background:var(--panel);padding:2px 5px}.export{font:inherit;color:var(--muted);white-space:pre-wrap;font-size:12px}.conflict{padding:23px 0;border-top:1px solid var(--line)}.conflict h2{font-size:14px}.subnav{display:flex;gap:23px;margin:25px 0 30px;border-bottom:1px solid var(--line);padding-bottom:14px}.subnav button{padding:0;border:0}.subnav button.active{color:var(--head);text-decoration:underline}.statepick{font-size:12px;margin:16px 0;display:flex;gap:10px;align-items:center}.statepick select{padding:3px 6px;font-size:12px}.visuallyhidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1100px){main{padding:28px 24px}.workspace{grid-template-columns:minmax(0,1fr) 248px;gap:22px}.inspector{padding-left:20px}.pagehead{flex-wrap:wrap}.foldertop{flex-wrap:wrap;gap:4px}}@media(max-width:800px){.shell{grid-template-columns:150px minmax(0,1fr)}aside{padding:25px 14px}.workspace{display:block}.inspector{border-left:0;border-top:1px solid var(--line);padding:24px 0;margin-top:26px}.twocol{display:block}.table{display:block;overflow:auto}.steps{gap:12px}.pagehead .actions{gap:10px}footer{height:auto;min-height:36px}.titlebar{padding:0 15px}}
</style></head><body>
<div class="titlebar"><strong>nanosync</strong><span>Desktop client / Linux</span><div class="actions"><button id="theme" aria-label="Switch color theme">Dark mode</button><button id="close-window">Close window</button></div></div>
<div class="shell"><aside><div class="brand">nanosync</div><nav aria-label="Main"><button data-nav="folders">Folders <span id="folder-count">4</span></button><button data-nav="conflicts">Conflicts <span class="count" id="conflict-count">2</span></button><button data-nav="connections">Connections <span>2</span></button><button data-nav="settings">Settings</button></nav><div class="aside-bottom"><p id="overall" class="danger">Needs attention</p><p id="attention-summary">2 conflicts<br>1 folder unavailable</p><div class="rule"><p>Desktop + CLI<br>Shared local state</p><button class="link" id="quit">Quit nanosync</button></div></div></aside><main id="content"></main></div>
<footer><span>Interactive design / sample data / no file operations</span><label>Preview state <select id="scenario"><option value="mixed">Everyday use</option><option value="empty">No folders</option><option value="locked">Credentials locked</option><option value="migration">File-backed credentials</option><option value="up-to-date">Up to date</option><option value="offline">Offline</option><option value="failure">Access revoked</option></select></label></footer><dialog id="dialog"></dialog><div class="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={view:'folders',selected:0,global:false,step:0,enroll:'waiting',admin:true,settings:'general',start:false,tray:true,background:true,notifications:true,scenario:'mixed',theme:'light',ignoreValid:false,connected:false,ack:false,newserver:'home',newvault:'documents',device:'workstation'};
const folders=[{name:'Documents',vault:'documents',server:'home',path:'~/Documents',status:'Syncing',owner:'Desktop',last:'Today, 10:42',pending:'12 files · 18.4 MiB',paused:false},{name:'Notes',vault:'notes',server:'home',path:'~/Notes',status:'Conflicts',owner:'Desktop',last:'Today, 10:38',pending:'2 preserved copies',paused:false},{name:'Documents · second copy',vault:'documents',server:'home',path:'~/Work/reference',status:'Paused',owner:'CLI',last:'Yesterday, 18:21',pending:'No transfers pending',paused:true},{name:'Media',vault:'media',server:'offsite',path:'/mnt/archive/media',status:'Folder unavailable',owner:'Desktop',last:'Yesterday, 23:14',pending:'State preserved',paused:false}];
function btn(text,action,cls=''){return `<button class="${cls}" data-act="${action}">${text}</button>`}function head(title,desc,actions=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}function status(label){let error=['Conflicts','Folder unavailable','Access revoked','Credentials locked'].includes(label),paused=label==='Paused';return `<span class="status ${error?'danger':label==='Up to date'?'good':''}"><span aria-hidden="true" class="symbol ${error?'attn':paused?'pause':label==='Up to date'?'ok':'work'}"></span>${label}</span>`}function actual(f){if(state.scenario==='up-to-date')return state.global||f.paused?'Paused':'Up to date';if(state.scenario==='mixed'&&['Conflicts','Folder unavailable'].includes(f.status))return f.status;if(state.global||f.paused)return 'Paused';if(state.scenario==='offline')return 'Offline';if(state.scenario==='locked')return 'Credentials locked';if(state.scenario==='failure')return 'Access revoked';return f.status}function visibleFolders(){return state.scenario==='empty'?[]:folders}function summary(){const fs=visibleFolders(),conflicts=fs.filter(f=>actual(f)==='Conflicts').length*2,missing=fs.filter(f=>actual(f)==='Folder unavailable').length,locked=fs.filter(f=>actual(f)==='Credentials locked').length,failures=fs.filter(f=>actual(f)==='Access revoked').length;return {conflicts,missing,locked,failures,attention:conflicts+missing+locked+failures>0}}function toast(t){$('.toast').textContent=t;$('.toast').hidden=false}function modal(html){$('#dialog').innerHTML=html;$('#dialog').showModal()}function close(){if($('#dialog').open)$('#dialog').close()}function go(view){state.view=view;render()}function render(){$('.toast').hidden=true;document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===state.view?'page':'false'));const s=summary();$('#folder-count').textContent=visibleFolders().length;$('#conflict-count').textContent=s.conflicts;$('#overall').textContent=s.attention?'Needs attention':'No intervention needed';$('#overall').className=s.attention?'danger':'good';$('#attention-summary').innerHTML=[s.conflicts?s.conflicts+' conflicts':'',s.missing?s.missing+' folder unavailable':'',s.locked?'Unlock credential store':'',s.failures?'Access revoked':''].filter(Boolean).join('<br>')||'No actionable issues';const views={folders:folderView,conflicts:conflictsView,connections:connectionsView,settings:settingsView,connect:connectView,ignores:ignoresView,migration:migrationView};$('#content').innerHTML=(views[state.view]||folderView)();}
function folderView(){if(state.scenario==='empty')return head('Folders','Your local copies, in one place.',btn('Connect folder','connect','primary'))+`<div class="empty"><h2>Choose a folder. Keep it yours.</h2><p>Connect to an existing server, choose a vault, and give it a local home. Your files stay ordinary files.</p><p class="muted">Already using the CLI? Existing connections and folders appear here automatically.</p>${btn('Connect your first folder','connect','primary')}<p class="note">Server setup and vault creation happen outside this app.</p></div>`;if(state.scenario==='migration')return migrationView();let f=folders[state.selected]||folders[0];if(!f)return head('Folders','No connected folders.',btn('Connect folder','connect','primary'));let label=actual(f);let notice=state.global?`<div class="notice"><p><strong>Global pause is on.</strong><br><span class="small muted">No new work in either direction. Current filesystem work stops safely.</span></p>${btn('Resume globally','global','link')}</div>`:state.scenario==='locked'?`<div class="notice"><p><strong>Unlock your OS credential store.</strong><br><span class="small muted">Sync is waiting. No credentials will be written to a plaintext file.</span></p>${btn('Unlock credentials','unlock','link')}</div>`:summary().conflicts?`<div class="notice"><p>${status('Conflicts')} <span class="small">Two versions need a look. Both are preserved.</span></p>${btn('Review conflicts','conflicts','link')}</div>`:state.scenario==='failure'?`<div class="notice"><p><strong>Access revoked.</strong> Local files are preserved; contact your server operator.</p>${btn('Reconnect device','connect','link')}</div>`:`<div class="notice"><p class="muted">${state.scenario==='offline'?'Briefly offline. Local editing remains available; sync will retry.':'No intervention needed. Paused folders remain paused.'}</p></div>`;return head('Folders','Connected folders, not another filesystem.',btn('Connect folder','connect','primary')+btn(state.global?'Resume globally':'Pause globally','global'))+notice+`<div class="workspace"><section class="folderlist" aria-label="Connected folders"><div class="listhead"><span>${folders.length} local copies · 2 servers</span><span>Sync owner shown per folder</span></div>${folders.map((x,i)=>`<div class="folder ${i===state.selected?'selected':''}"><div class="foldertop"><button class="name" data-folder="${i}" aria-pressed="${i===state.selected}">${esc(x.name)}</button>${status(actual(x))}</div><div class="path">${esc(x.path)}</div>${actual(x)==='Syncing'?'<div class="progress" aria-label="62 percent transferred"><span></span></div>':''}<div class="meta"><span>${x.server} / ${x.vault}</span><span>${x.owner==='CLI'?'Owned by CLI':actual(x)==='Syncing'?'12 of 19 files':actual(x)==='Conflicts'?'2 preserved copies':actual(x)==='Up to date'?'No pending transfers':actual(x)==='Paused'?'Paused deliberately':actual(x)==='Folder unavailable'?'State preserved':actual(x)==='Offline'?'Retrying connection':'Action required'}</span></div></div>`).join('')}<p class="note">“Up to date” means observed changes are published, the latest checked remote state is applied, and no transfers or conflicts remain.</p></section><section class="inspector" aria-label="Selected folder"><h2>${esc(f.name)}</h2><p class="path">${esc(f.path)}</p><div class="actions">${btn('Open folder','open','link')}${btn('Sync now','sync-now','link')}${btn(f.paused?'Resume folder':'Pause folder','pause','link')}</div><dl class="kv"><div><dt>Server / vault</dt><dd>${f.server} / ${f.vault}</dd></div><div><dt>Sync owner</dt><dd>${f.owner}</dd></div><div><dt>Last successful sync</dt><dd>${f.last}</dd></div></dl><div class="rule">${detail(f,label)}</div><div class="rule"><h3 style="margin-top:0">Local binding</h3><div class="actions">${btn('Edit ignore rules','ignores','link')}</div><p class="note">Rules apply to this copy only.</p>${btn('Disconnect folder','disconnect','link')}</div><p class="note">${f.owner==='CLI'?'Independently CLI-owned sync keeps running when you quit the desktop. Shared pause settings still apply.':state.background?'Closing the window keeps this sync running. Explicit Quit stops desktop-owned syncing.':'Closing the window exits the desktop and stops desktop-owned syncing. Independently CLI-owned sync continues.'}</p></section></div>`}
function detail(f,label){if(label==='Syncing')return `<h3 style="margin-top:0">Applying your changes</h3><p>12 of 19 files · 18.4 MiB remaining</p><div class="progress"><span></span></div><p class="muted">Local edits remain available while transfers continue.</p>`;if(label==='Folder unavailable')return `<h3 class="danger" style="margin-top:0">Folder unavailable</h3><p>The connected root is missing. Sync is stopped; its state is preserved.</p><p class="muted">Reconnect the drive, then retry. The folder will not be recreated or treated as deleted contents.</p>${btn('Retry folder','retry')}`;if(label==='Conflicts')return `<h3 class="danger" style="margin-top:0">2 conflicts to resolve</h3><p>Original files and conflicting copies are preserved. Review them in your own editor.</p>${btn('Review conflicts','conflicts','link')}`;if(label==='Credentials locked')return `<h3 style="margin-top:0">Credentials locked</h3><p>Unlock the OS credential store to continue. There is no plaintext fallback.</p>${btn('Unlock credentials','unlock')}`;if(label==='Offline')return `<h3 style="margin-top:0">Server unreachable</h3><p>Local editing is still available. Sync will retry when the connection returns.</p>${btn('Retry connection','retry')}`;if(label==='Access revoked')return `<h3 class="danger" style="margin-top:0">Access revoked</h3><p>This device can no longer access this vault. Local files are preserved. Contact the operator or enroll again.</p>${btn('Reconnect device','connect')}`;if(label==='Paused')return `<h3 style="margin-top:0">${state.global?'Globally paused': 'Paused on this folder'}</h3><p>New work in both directions is stopped. Local editing is unrestricted.</p><p class="muted">${f.paused?'This folder stays paused when global pause is removed.':'Removing global pause allows this folder to continue.'}</p>`;return `<h3 class="good" style="margin-top:0">Up to date</h3><p>No pending transfers or unresolved conflicts. Latest checked remote state applied.</p>`}
function conflictsView(){if(!summary().conflicts)return head('Conflicts','No unresolved conflicts in this preview state.')+'<p class="muted">No preserved copies require attention.</p>';return head('Conflicts','Nothing discarded. Review preserved copies in your own editor.')+`<div class="textcol"><p class="muted">Resolve the content manually, then acknowledge each reviewed conflict. Nanosync does not choose a version or merge files for you.</p>${['project-plan.md','reading-list.md'].map((n,i)=>`<section class="conflict"><h2>${n}</h2><p class="small muted">home / notes · ~/Notes</p><dl class="kv"><div><dt>Working file</dt><dd>${n}</dd></div><div><dt>Preserved copy</dt><dd>${n.replace('.md','')} (conflict-laptop).md</dd></div></dl><div class="actions">${btn('Open containing folder','open','link')}${btn('I have resolved this','resolve-'+i)}</div></section>`).join('')}<p class="note">Filenames are shown inside the app. Notification bodies hide filenames and paths by default.</p></div>`}
function connectionsView(){return head('Connections','Existing servers and this device’s access.',btn('Add connection','connect','primary'))+`<table class="table"><thead><tr><th>Server</th><th>Device access</th><th>Credentials</th><th></th></tr></thead><tbody><tr><td><strong>home</strong><br><span class="muted">https://sync.home.example</span></td><td>${status('Up to date')}<br><span class="muted">Enrolled · workstation</span></td><td>OS credential store</td><td>${btn('Details','connection-home','link')}</td></tr><tr><td><strong>offsite</strong><br><span class="muted">https://sync.offsite.example</span></td><td>Enrolled · workstation</td><td>OS credential store</td><td>${btn('Details','connection-offsite','link')}</td></tr></tbody></table><div class="textcol rule"><h2>One set of connections</h2><p class="muted">Connections and folder bindings are shared with the client CLI. Creating a second local copy of a vault is supported when its root does not overlap another binding.</p><h3>Server administration stays external</h3><p class="muted">Vault creation, device approval and server setup belong to the server operator. This client does not embed those controls.</p><div class="actions">${btn('Preview credential migration','migration','link')}${btn('Preview pending enrollment','pending','link')}</div></div>`}
function settingsView(){const tab=state.settings;return head('Settings','Small, explicit choices. Shared with the client CLI.')+`<nav class="subnav" aria-label="Settings categories">${['general','notifications','diagnostics'].map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</nav><div class="textcol">${tab==='general'?`<section class="section"><h2>Window & startup</h2>${lifecycle()}<p class="note">User-login startup only. Desktop sync stops at logout. With background mode off, login startup opens a window; with background mode on, it starts hidden.</p></section><section class="section"><h2>Tray behavior</h2><p>Status and reopening only. On Linux AppIndicator, the menu contains just “Open Nanosync”. No pause or quit controls live here.</p><div class="actions">${btn('Preview tray','tray','link')}${btn('Preview unavailable tray','tray-unavailable','link')}</div><p class="note">A filled circle means no intervention needed, including normal syncing, a deliberate pause, or a brief outage. A diamond badge means attention needed. Status text accompanies both.</p></section>`:tab==='notifications'?`<section class="section"><h2>Only when something needs you</h2><label class="check"><input type="checkbox" id="notifications" ${state.notifications?'checked':''}><span>Enable notifications<small>Repeated alerts are deduplicated. Persistent details stay in the app.</small></span></label>${['Conflicts','Revoked access','Persistent failures'].map(t=>`<label class="check"><input type="checkbox" checked ${state.notifications?'':'disabled'}><span>${t}</span></label>`).join('')}<label class="check"><input type="checkbox"><span>Include filenames and paths in notifications<small>Off by default. Notification previews are private unless you explicitly opt in.</small></span></label><p class="note">No alerts for successful syncs or brief offline periods.</p></section>`:`<section class="section"><h2>Export diagnostics</h2><p>Share a report when you need help. Export is explicit; nothing is sent automatically.</p><div class="quietbox"><strong>Included</strong><p class="small muted">App/platform labels, status codes, ownership and recovery state.</p><strong>Excluded</strong><p class="small muted">Credentials, keys, passwords, recovery material, file contents, filenames and paths.</p></div>${btn('Review diagnostic report','diagnostics','primary')}<p class="note">The prototype exports a synthetic report only. Production diagnostics must be generated and redacted by the shared client engine.</p></section>`}</div>`}
function lifecycle(){return `<label class="check"><input type="checkbox" id="start" ${state.start?'checked':''}><span>Start at user login<small>Opt-in. Runs after login, never before it.</small></span></label><label class="check"><input type="checkbox" id="tray" ${state.tray?'checked':''}><span>Show tray status<small>Optional. Reopening the launcher restores your window even without a tray.</small></span></label><label class="check"><input type="checkbox" id="background" ${state.background?'checked':''}><span>Keep syncing after closing the window<small>${state.background?'Closing hides this window and keeps desktop sync running.':'Closing exits the desktop and stops desktop-owned sync.'} Explicit Quit stops desktop-owned sync; independently CLI-owned syncing continues.</small></span></label>`}
const stepnames=['Server','Verify device','Vault & folder','Background','Start'];
function connectView(){let s=state.step;let body='';if(s===0)body=`<h2>Connect to your server</h2><p class="muted">Use an existing server. Set up the server and its vaults separately.</p><label class="field">Server URL<input id="url" type="url" value="https://sync.home.example" required></label><label class="field">Connection name<input id="alias" value="home" required></label><label class="field">Device name<input id="device-name" value="workstation" required></label><label class="field">Account password, if required<input id="password" type="password" autocomplete="off" placeholder="Not retained by nanosync"></label><p class="note">Example addresses and all enrollment data here are fictional.</p>`;
if(s===1)body=`<h2>${state.enroll==='waiting'?'Approve this device externally':state.enroll==='approved'?'Device approved':state.enroll==='denied'?'Enrollment denied':state.enroll==='expired'?'Enrollment expired':'Connection interrupted'}</h2><p>Compare this code with the request shown by your server operator.</p><div class="verification">H7KM–2QXP</div><p class="small muted">${esc(state.device)} · pending request saved locally</p>${state.enroll==='waiting'?`<p>Waiting for approval. Restarting the app or a temporary outage does not lose this request.</p>`:state.enroll==='approved'?'<p class="good">This device may now access the server.</p>':`<p class="danger">${state.enroll==='denied'?'The operator denied this request. Check with them before requesting again.':state.enroll==='expired'?'Request a new code to continue. The previous code is no longer valid.':'Pending identity is preserved. Retry when the server is reachable.'}</p>${btn(state.enroll==='error'?'Retry pending request':'Request new enrollment','enroll-retry')}`}<div class="actions">${state.admin?'<a href="https://sync.home.example/admin" target="_blank" rel="noopener">Open server administration ↗</a>':'<p class="muted">This server has no web administration. Ask its operator to approve externally.</p>'}</div><div class="statepick"><label for="enroll-state">Preview response</label><select id="enroll-state">${['waiting','approved','denied','expired','error'].map(x=>`<option ${state.enroll===x?'selected':''}>${x}</option>`).join('')}</select></div><label class="check small"><input type="checkbox" id="admin" ${state.admin?'checked':''}>Server advertises web administration</label>`;
if(s===2)body=`<h2>Give this vault a local home</h2><label class="field">Vault<select id="vault"><option>documents</option><option>notes</option><option>media</option></select></label><label class="field">Local folder<input id="local-path" value="/home/alex/Sync/documents"></label>${btn('Choose folder…','choose-folder')}<label class="field">Recovery key, when required<input type="password" id="recovery" autocomplete="off" placeholder="Enter vault recovery key"></label><div class="quietbox"><strong>This folder already contains files.</strong><p class="small">Local and remote contents will be reconciled; conflicts are preserved. Existing local files do not mean remote files were deleted.</p></div><label class="check"><input type="checkbox" id="ack" ${state.ack?'checked':''}><span>I understand that this folder’s contents will be reconciled.</span></label><p class="note">Roots must not overlap existing bindings. Connecting does not start transferring files.</p>`;
if(s===3)body=`<h2>How should nanosync run?</h2><p class="muted">You can change these choices later in Settings.</p>${lifecycle()}<p class="note">Tray support is optional. With no tray, launch nanosync again to reopen it. No desktop sync continues after logout.</p>`;
if(s===4)body=`<h2>Connected. Not syncing yet.</h2><p>Your local folder is ready. No transfers start until you choose <strong>Start syncing</strong>.</p><dl class="kv"><div><dt>Server / vault</dt><dd>${esc(state.newserver)} / ${esc(state.newvault)}</dd></div><div><dt>Local folder</dt><dd>${esc(state.newpath||'/home/alex/Sync/documents')}</dd></div><div><dt>Credentials</dt><dd>OS credential store</dd></div><div><dt>After closing window</dt><dd>${state.background?'Keep syncing':'Stop desktop sync'}</dd></div></dl><p class="note">Existing contents will be reconciled without discarding conflicting versions.</p>`;
return head('Connect folder','A local copy, connected on purpose.',btn('Cancel setup','folders','link'))+`<div class="steps" aria-label="Setup progress">${stepnames.map((n,i)=>`<span class="${s===i?'active':''}" ${s===i?'aria-current="step"':''}>${i+1}. ${n}</span>`).join('')}</div><div class="wizard">${body}<div id="form-error" class="error" role="alert"></div><div class="bottom">${s>0?btn('Back','back'): '<span></span>'}<div class="actions">${s===4?btn('Finish without syncing','finish')+btn('Start syncing','start-sync','primary'):btn(s===0?'Request enrollment':s===2?'Connect folder':'Continue','next','primary')}</div></div></div>`}
function ignoresView(){let f=folders[state.selected];return head('Ignore rules',esc(f.name)+' / '+esc(f.path),btn('Back to folder','folders','link'))+`<div class="textcol"><p>Edit this binding’s <span class="inlinecode">.nanosyncignore</span>. These rules apply only here, not to other copies or devices.</p><label for="rules">Rules</label><textarea id="rules" spellcheck="false"># Device-local rules\n.venv/\ncache/\n*.tmp</textarea><p class="note">Existing syntax and tracked-entry safeguards come from the shared engine. Saving never silently deletes local or remote data.</p><div class="statepick"><label for="validation-result">Preview engine validation</label><select id="validation-result"><option value="valid">Valid rules</option><option value="invalid">Invalid rule</option></select></div><div id="validation" role="status"></div><div class="actions rule">${btn('Validate rules','validate')}${btn('Save rules','save-ignores','primary')}</div><p class="note">Validation in this design is simulated. Production must use the existing parser, not a new pattern language.</p></div>`}
function migrationView(){return head('Choose how to use CLI credentials','Protected-file state was found. Nothing has been changed.')+`<div class="textcol"><p>The CLI explicitly uses a protected credential file for headless operation. The desktop uses the OS credential store. It will not switch modes, copy secrets, or start this binding automatically.</p><section class="section"><h2>Keep headless CLI operation</h2><p class="muted">Leave this state file-backed and manage it through the CLI. Return to the desktop without opening that state.</p>${btn('Leave state unchanged','migration-keep')}</section><section class="section"><h2>Migrate to the OS credential store</h2><p class="muted">An explicit migration changes how this state is unlocked. Headless commands may no longer work without an unlocked user-session store.</p><p class="note">Implementation must define an atomic, validated migration and a recovery plan. This prototype does not move any secrets.</p>${btn('Review migration decision','migration-review')}</section></div>`}
function actions(action){switch(action){case 'folders':case 'conflicts':case 'connections':case 'settings':case 'migration':go(action);break;case 'connect':state.step=0;state.enroll='waiting';state.ack=false;go('connect');break;case 'pending':state.step=1;state.enroll='waiting';go('connect');break;case 'global':state.global=!state.global;render();break;case 'pause':folders[state.selected].paused=!folders[state.selected].paused;render();toast('Shared per-folder pause updated. In-progress filesystem work reaches a safe stopping point.');break;case 'sync-now':toast('Prototype: one sync pass requested through the existing owner. Pause settings and ownership still apply.');break;case 'open':toast('Prototype: the native client would open the containing folder in your file manager.');break;case 'retry':toast('Prototype: retry requested. State stays preserved until the engine confirms recovery.');break;case 'unlock':modal(`<h2>Unlock the credential store</h2><p>The native client will ask the OS to unlock its credential store. Nanosync does not ask for or save your OS password in this window.</p><div class="actions">${btn('Cancel','modal-close')}${btn('Simulate successful unlock','unlocked','primary')}</div>`);break;case 'unlocked':close();state.scenario='mixed';$('#scenario').value='mixed';render();toast('Simulated unlock. No OS credentials were accessed.');break;case 'ignores':state.ignoreValid=false;go('ignores');break;case 'validate':state.ignoreValid=$('#validation-result').value==='valid';$('#validation').innerHTML=state.ignoreValid?'<p class="good">Validation passed. Ready to save.</p>':'<p class="error">Line 3: unsupported rule. Correct the rule and validate again.</p>';break;case 'save-ignores':if(!state.ignoreValid){$('#validation').innerHTML='<p class="error">Validate the current rules before saving.</p>';return}toast('Prototype: validated rules saved for this binding only. No files deleted.');go('folders');break;case 'disconnect':modal(`<h2>Disconnect ${esc(folders[state.selected].name)}?</h2><p>Local files and remote data stay intact. This only disconnects the local binding.</p><p class="warning">Pending work: ${folders[state.selected].pending}. Sync must reach a safe stopping point and release ownership before disconnecting.</p><label class="check"><input type="checkbox" id="abandon"><span>I understand that pending sync state will be abandoned.</span></label><div class="actions">${btn('Keep connected','modal-close')}${btn('Disconnect folder','confirm-disconnect')}</div><div id="disconnect-error" class="error" role="alert"></div>`);break;case 'confirm-disconnect':if(!$('#abandon').checked){$('#disconnect-error').textContent='Acknowledge pending synchronization state to continue.';return}folders.splice(state.selected,1);state.selected=0;close();go('folders');toast('Prototype: binding disconnected. Local files and remote data preserved.');break;case 'next':if(state.step===0){if(!$('#url').value.trim()||!$('#url').validity.valid||!$('#alias').value.trim()||!$('#device-name').value.trim()){$('#form-error').textContent='Enter a valid server URL and connection name.';return}state.newserver=$('#alias').value.trim();state.device=$('#device-name').value.trim();$('#password').value=''}if(state.step===1&&state.enroll!=='approved'){$('#form-error').textContent='Approval is required before choosing a vault. Use the preview response to simulate server approval.';return}if(state.step===2){const p=$('#local-path').value.trim();if(!p.startsWith('/')){$('#form-error').textContent='Choose an absolute local folder path.';return}if(['/home/alex/Documents','/home/alex/Notes','/mnt/archive/media'].some(root=>p===root||p.startsWith(root+'/')||root.startsWith(p+'/'))){$('#form-error').textContent='This path overlaps an existing binding. Choose a separate folder.';return}if(!$('#ack').checked){$('#form-error').textContent='Acknowledge reconciliation of this nonempty folder.';return}state.newpath=p;state.newvault=$('#vault').value;$('#recovery').value=''}state.step++;render();break;case 'back':state.step--;render();break;case 'enroll-retry':state.enroll='waiting';render();break;case 'choose-folder':toast('Prototype folder picker: edit the absolute path field to preview a selection.');break;case 'finish':case 'start-sync':state.connected=true;folders.push({name:state.newvault+' · new copy',vault:state.newvault,server:state.newserver,path:state.newpath||'/home/alex/Sync/documents',status:action==='finish'?'Paused':'Syncing',paused:action==='finish',owner:'Desktop',last:'Never',pending:action==='finish'?'Not started':'Initial reconciliation'});state.selected=folders.length-1;state.scenario='mixed';$('#scenario').value='mixed';go('folders');toast(action==='finish'?'Connected without starting transfers.':'Prototype: explicit initial sync requested.');break;case 'tray':modal(`<h2>Tray preview</h2><p>${summary().attention?status('Conflicts')+' · needs attention':status('Up to date').replace('Up to date','No intervention needed')}</p><p class="small muted">Linux AppIndicator fallback menu:</p>${btn('Open Nanosync','modal-close')}<p class="note">This menu contains only reopening. Tray integration is not running in this HTML prototype.</p>`);break;case 'tray-unavailable':toast('Tray unavailable. Sync still runs. Reopen nanosync from your launcher to restore the window.');break;case 'migration-keep':state.scenario='mixed';$('#scenario').value='mixed';go('folders');toast('File-backed CLI credentials left unchanged; that state was not opened by the desktop.');break;case 'migration-review':modal(`<h2>Explicit credential migration</h2><p>Migrate selected file-backed state to the OS credential store only after it is unlocked. Stop active owners safely and validate the migration before changing credential mode.</p><p>Headless CLI use may require a user-session credential store afterward. No duplicate secrets should remain.</p><p class="note">This is a proposed decision screen; secure migration mechanics require technical design.</p><div class="actions">${btn('Keep file-backed state','modal-close')}${btn('Confirm migration preview','migration-preview')}</div>`);break;case 'migration-preview':close();toast('Decision preview only. No credentials migrated or copied.');break;case 'diagnostics':modal(`<h2>Review diagnostics</h2><pre class="export">source: synthetic design fixture\nplatform: Linux (prototype)\nstatus: conflict_pending\nowner: desktop\npaths: excluded\nfilenames: excluded\nsecrets: excluded</pre><p class="small muted">No file contents or identifying paths are included. Nothing is uploaded.</p><div class="actions">${btn('Cancel','modal-close')}${btn('Export sample report','export','primary')}</div>`);break;case 'export':{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({source:'synthetic design fixture',platform:'Linux prototype',status:'conflict_pending',owner:'desktop',paths:'excluded',filenames:'excluded',secrets:'excluded'},null,2)],{type:'application/json'}));a.download='nanosync-sample-diagnostics.json';a.click();close();toast('Exported a synthetic sample report, not actual system diagnostics.');break}case 'remove-connection':modal(`<h2>Remove this connection?</h2><p>Attached folder bindings must be disconnected safely first. Local files remain; removing a connection never revokes this device remotely.</p><p class="warning">This connection has attached bindings. The default action is blocked.</p><label class="check"><input type="checkbox" id="remove-ack"><span>I explicitly accept abandoning pending sync state for all affected bindings.</span></label><p class="note">An explicit forced removal still cannot bypass active owners or locks.</p><div class="actions">${btn('Keep connection','modal-close')}${btn('Preview explicit removal','remove-preview')}</div><p id="remove-error" class="error" role="alert"></p>`);break;case 'remove-preview':if(!$('#remove-ack').checked){$('#remove-error').textContent='Explicit acknowledgment required. Connection unchanged.';return}close();toast('Removal decision preview. No real credentials or bindings removed; owner coordination must succeed first.');break;case 'modal-close':close();break;default:if(/^resolve-[0-9]+$/.test(action))modal(`<h2>Acknowledge manual resolution?</h2><p>Confirm you reviewed the working file and preserved copy in your editor. This action must not discard either version.</p><p class="note">This prototype records no real resolution; production acknowledgment uses shared client conflict semantics.</p><div class="actions">${btn('Back to conflicts','modal-close')}${btn('Acknowledge preview','resolve-preview')}</div>`);else if(action==='resolve-preview'){close();toast('Acknowledgment preview. No files changed; sample conflicts remain visible.')}else if(action.startsWith('connection-'))modal(`<h2>${action.slice(11)} connection</h2><dl class="kv"><div><dt>Device</dt><dd>workstation</dd></div><div><dt>Credential mode</dt><dd>OS credential store</dd></div></dl><p>Vault and device administration remain external.</p><a href="https://sync.home.example/admin" target="_blank" rel="noopener">Open server administration ↗</a><div class="actions">${btn('Close','modal-close')}${btn('Remove connection','remove-connection')}</div>`);}}
function lifecycleDialog(quit){modal(`<h2>${quit?'Quit nanosync?':state.background?'Hide this window?':'Close and stop desktop sync?'}</h2><p>${quit||!state.background?'Desktop-owned syncing stops safely. Independently CLI-owned syncing continues.':'Desktop-owned syncing continues in the background, including when the tray is disabled or unavailable.'}</p><p class="muted">${quit||!state.background?'Shared per-folder and global pause settings remain in effect.':'Reopen from the launcher or tray. Explicit Quit is available in the app.'}</p><div class="actions">${btn('Cancel','modal-close')}${btn(quit?'Preview Quit':state.background?'Preview hide':'Preview exit','lifecycle-preview','primary')}</div>`)}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}const folder=e.target.closest('[data-folder]');if(folder){state.selected=Number(folder.dataset.folder);render();return}const tab=e.target.closest('[data-tab]');if(tab){state.settings=tab.dataset.tab;render();return}const a=e.target.closest('[data-act]');if(a){if(a.dataset.act==='lifecycle-preview'){close();toast('Lifecycle preview only. The browser window stays open; no native sync process is running.')}else actions(a.dataset.act)}});
document.addEventListener('change',e=>{let id=e.target.id;if(['start','tray','background','notifications','admin','ack'].includes(id)){state[id]=e.target.checked;if(['notifications','admin','background'].includes(id))render()}if(id==='scenario'){state.scenario=e.target.value;state.view='folders';render()}if(id==='enroll-state'){state.enroll=e.target.value;render()}if(id==='validation-result')state.ignoreValid=false});document.addEventListener('input',e=>{if(e.target.id==='rules'){state.ignoreValid=false;$('#validation').textContent='Rules changed. Validate before saving.'}});$('#theme').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;$('#theme').textContent=state.theme==='light'?'Dark mode':'Light mode'};$('#quit').onclick=()=>lifecycleDialog(true);$('#close-window').onclick=()=>lifecycleDialog(false);render();
</script></body></html>
